<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Batsányi Digitális Évkönyv 1951–2026</title>

<style>

:root{
  --primary:#0d3b66;
  --gold:#d4af37;
}
.main-wrapper{
max-width:1400px;
margin:auto;
}

body{
  background:#f3f5f7;
  transition:.3s;
}

.hero{
min-height:90vh;
display:flex;
align-items:center;
justify-content:center;
background:
linear-gradient(
135deg,
#102f4a,
#1d5d95
);
color:white;

}
.hero-img{
max-width:100%;
max-height:650px;
border-radius:24px;
box-shadow:
0 30px 60px rgba(0,0,0,.35);

}

.dark{
  background:#121212;
  color:#eee;
}

.dark .card{
  background:#1f1f1f;
  color:white;
}

.stat{
  border-radius:18px;
  transition:.25s;
}

.stat:hover{
  transform:translateY(-4px);
}

.results{
  max-height:650px;
  overflow:auto;
}

.timeline{
  max-height:500px;
  overflow:auto;
}

.badge-custom{
  background:var(--gold);
  color:black;
}

</style>

</head>

<body>
<div class="main-wrapper">
<section class="hero">
<div class="container">
<div class="row align-items-center">
<div class="col-lg-6 text-center">
<h1 class="display-2 fw-bold">
Batsányi Digitális Évkönyv
</h1>
<h2>1951–2026</h2>

<div class="mt-4">
<button class="btn btn-warning"
onclick="toggleDark()">
🌙 Sötét mód
</button>
</div>
</div>
<div class="col-lg-6 text-center">
<img
src="batsanyi.png"

class="hero-img"
alt="Batsányi">
</div>
</div>
</div>
</section>

<div class="container py-4">

<div class="row g-3 mb-4">

<div class="col-md-3">
<div class="card stat text-center p-3">
<h2 id="tanuloCount">0</h2>
Tanuló
</div>
</div>

<div class="col-md-3">
<div class="card stat text-center p-3">
<h2 id="osztalyCount">0</h2>
Osztály
</div>
</div>

<div class="col-md-3">
<div class="card stat text-center p-3">
<h2 id="evCount">0</h2>
Év
</div>
</div>

<div class="col-md-3">
<div class="card stat text-center p-3">
<h2 id="ofCount">0</h2>
Osztályfőnök
</div>
</div>

</div>

<div class="card p-4 mb-4">

<h3>🔍 Keresés</h3>

<div class="row g-2">

<div class="col-md-4">
<input id="name"
class="form-control"
placeholder="Név">
</div>

<div class="col-md-2">
<input id="year"
class="form-control"
placeholder="Év">
</div>

<div class="col-md-2">
<input id="classroom"
class="form-control"
placeholder="Osztály">
</div>

<div class="col-md-2">
<input id="teacher"
class="form-control"
placeholder="Osztályfőnök">
</div>

<div class="col-md-2">
<button class="btn btn-primary w-100"
onclick="search()">
Keresés
</button>
</div>

</div>

</div>

<div class="row">

<div class="col-lg-8">

<div class="card p-3">

<h4>Találatok</h4>

<div class="results">

<table class="table table-striped">

<thead>
<tr>
<th>Év</th>
<th>Osztály</th>
<th>Osztályfőnök</th>
<th>Név</th>
<th>Tagozat</th>
</tr>
</thead>

<tbody id="results">
</tbody>

</table>

</div>

</div>

</div>

<div class="col-lg-4">

<div class="card p-3 mb-3">

<h4>🏛 Igazgatók</h4>

<ul id="directors">
</ul>

</div>

<div class="card p-3 mb-3">

<h4>📅 Évek</h4>

<div id="timeline"
class="timeline">
</div>

</div>

<div class="card p-3">

<h4>📊 Top vezetéknevek</h4>

<ul id="surnames">
</ul>

</div>

</div>

</div>

</div>

<script>

let adatbazis=[];
let igazgatok=[];
let stat={};

Promise.all([
fetch("adatbazis.json").then(r=>r.json()),
fetch("igazgatok.json").then(r=>r.json()),
fetch("statistics.json").then(r=>r.json())
])
.then(([db,ig,st])=>{

adatbazis=db;
igazgatok=ig;
stat=st;

loadDashboard();
loadDirectors();
loadTimeline();
search();

});

function loadDashboard(){

document.getElementById("tanuloCount").innerText=
stat.osszes_tanulo;

document.getElementById("osztalyCount").innerText=
stat.osszes_osztaly;

document.getElementById("evCount").innerText=
stat.osszes_ev;

document.getElementById("ofCount").innerText=
stat.osszes_osztalyfonok;

let html="";

stat.leggyakoribb_vezeteknevek.forEach(x=>{

html+=`
<li>
${x.nev}
<span class="badge badge-custom">
${x.db}
</span>
</li>
`;

});

document.getElementById("surnames").innerHTML=
html;

}

function loadDirectors(){

let html="";

igazgatok.forEach(i=>{

html+=`
<li>
<b>${i.nev}</b><br>
${i.tol} - ${i.ig ?? "jelenleg"}
</li>
`;

});

document.getElementById("directors").innerHTML=
html;

}

function loadTimeline(){

let html="";

stat.evek.forEach(ev=>{

html+=`
<div class='border-bottom p-1'>
${ev}
</div>
`;

});

document.getElementById("timeline").innerHTML=
html;

}

function search(){

const nev=document.getElementById("name").value.toLowerCase();
const ev=document.getElementById("year").value;
const osztaly=document.getElementById("classroom").value.toLowerCase();
const ofo=document.getElementById("teacher").value.toLowerCase();

let result=adatbazis.filter(r=>{

return (
(!nev || r.tanulo.toLowerCase().includes(nev))
&& (!ev || r.ev==ev)
&& (!osztaly || r.osztaly.toLowerCase().includes(osztaly))
&& (!ofo || String(r.osztalyfonok||"").toLowerCase().includes(ofo))
);

});

let html="";

result.slice(0,2000).forEach(r=>{

html+=`
<tr>
<td>${r.ev}</td>
<td>${r.osztaly}</td>
<td>${r.osztalyfonok ?? "-"}</td>
<td>${r.tanulo}</td>
<td>${r.tagozat}</td>
</tr>
`;

});

document.getElementById("results").innerHTML=
html;

}

document.addEventListener("input", e=>{

if(
e.target.id==="name" ||
e.target.id==="year" ||
e.target.id==="classroom" ||
e.target.id==="teacher"
){
search();
}

});

function toggleDark(){

document.body.classList.toggle("dark");

}

</script>
</div>
</body>
</html>
